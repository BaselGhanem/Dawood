<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#099999">
  <title>تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-panel">
      <div class="brand-mark">د</div>
      <h1>نظام داود غانم</h1>
      <p>مبيعات نقدية، صناديق، رواتب، مخزون، وكشوفات مختصرة حسب الصلاحيات.</p>
      <div class="login-pills">
        <span>بيع نقدي</span><span>صندوق</span><span>مخزون</span><span>كشوفات</span>
      </div>
    </section>
    <section class="login-card">
      <form id="loginForm" autocomplete="on">
        <h2>تسجيل الدخول</h2>
        <label>البريد الإلكتروني أو اسم المستخدم
          <input id="loginEmail" name="email" required autocomplete="username" inputmode="email">
        </label>
        <label>كلمة المرور
          <input id="loginPassword" name="password" type="password" required autocomplete="current-password">
        </label>
        <button class="btn primary block" type="submit">دخول النظام</button>
        <p id="loginHint" class="hint"></p>
      </form>
    </section>
  </main>
  <script type="module" src="./auth.js"></script>
</body>
</html>
